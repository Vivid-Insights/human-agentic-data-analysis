# Python environment for this analysis workspace.
# Managed by uv (https://docs.astral.sh/uv/). Do not edit uv.lock by hand.
#
#   ./setup_env.sh                  # create the environment
#   uv run python my_script.py      # run code inside it
#
[project]
name = "analysis-workspace"
version = "0.1.0"
description = "Reproducible Python environment for the data analysis workspace"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core data handling
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",       # fast Parquet/Arrow IO for derived datasets
    # File formats
    "openpyxl>=3.1",     # .xlsx
    "xlrd>=2.0",         # legacy .xls
    "tabulate>=0.9",     # Markdown tables for Report.md / Appendix.md
    # Statistics
    "scipy>=1.13",
    "statsmodels>=0.14",
    # Charts
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
